<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERAP-UAC | Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --page-bg: #f6f8fb; --card-bg: #ffffff; --text-main: #172033; --border: #e5e7eb; }
        [data-bs-theme="dark"] { --page-bg: #07111f; --card-bg: #111827; --text-main: #f8fafc; --border: #243244; }
        body { min-height: 100vh; display: grid; place-items: center; background: var(--page-bg); color: var(--text-main); font-family: 'Inter', sans-serif; }
        .auth-card { width: min(440px, calc(100vw - 2rem)); background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; }
        .brand-logo { width: 54px; height: 54px; object-fit: contain; }
        .btn { border-radius: 6px; font-weight: 700; padding: .75rem 1rem; }
    </style>
</head>
<body>
    <main class="auth-card">
        <div class="d-flex align-items-center justify-content-between gap-3">
            <a href="/" class="text-decoration-none fw-bold d-flex align-items-center gap-2">
                <img src="/static/LOGO-UAC.png" alt="Logo UAC" class="brand-logo">SERAP-UAC
            </a>
            <button type="button" id="themeToggle" class="btn btn-outline-secondary px-3" aria-label="Changer le theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        <h1 class="h3 fw-bold mt-4">Connexion</h1>
        <p class="text-muted">Accedez a votre espace selon votre role.</p>
        {% if erreur %}<div class="alert alert-danger">{{ erreur }}</div>{% endif %}
        <form method="post" action="/connexion" class="d-grid gap-3">
            <div><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
            <div><label class="form-label">Mot de passe</label><input class="form-control" type="password" name="mot_de_passe" required></div>
            <button class="btn btn-primary" type="submit"><i class="fas fa-right-to-bracket me-2"></i>Se connecter</button>
        </form>
        <p class="mt-3 mb-0 text-muted">Pas encore de compte ? <a href="/inscription">Creer un compte etudiant</a></p>
    </main>
    <footer class="position-fixed bottom-0 start-0 end-0 py-3 text-center small">
        <span class="fw-bold">JOELO SYAYIPUMA</span>
        <a class="ms-3 text-decoration-none" href="mailto:syayipumajksjoelo@gmail.com"><i class="fas fa-envelope me-1"></i>Email</a>
        <a class="ms-3 text-decoration-none" href="https://wa.me/243820956022" target="_blank" rel="noopener"><i class="fab fa-whatsapp me-1"></i>WhatsApp</a>
    </footer>
    <script>
        const root = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        function applyTheme(theme) {
            root.setAttribute('data-bs-theme', theme);
            localStorage.setItem('serap_theme', theme);
            themeBtn.innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
        applyTheme(localStorage.getItem('serap_theme') || 'light');
        themeBtn.addEventListener('click', () => applyTheme(root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'));
    </script>
</body>
</html>
