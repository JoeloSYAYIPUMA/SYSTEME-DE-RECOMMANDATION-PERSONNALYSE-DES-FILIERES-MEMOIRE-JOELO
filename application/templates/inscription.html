<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERAP-UAC | Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; font-family: 'Inter', sans-serif; }
        .auth-card { width: min(480px, calc(100vw - 2rem)); background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 2rem; }
        .brand-logo { width: 54px; height: 54px; object-fit: contain; }
        .btn { border-radius: 6px; font-weight: 700; padding: .75rem 1rem; }
    </style>
</head>
<body>
    <main class="auth-card">
        <a href="/" class="text-decoration-none fw-bold d-flex align-items-center gap-2"><img src="/static/LOGO-UAC.png" alt="Logo UAC" class="brand-logo">SERAP-UAC</a>
        <h1 class="h3 fw-bold mt-4">Inscription étudiant</h1>
        <p class="text-muted">Créez un compte pour accéder à la recommandation personnalisée.</p>
        {% if erreur %}<div class="alert alert-danger">{{ erreur }}</div>{% endif %}
        <form method="post" action="/inscription" class="d-grid gap-3">
            <div><label class="form-label">Nom complet</label><input class="form-control" type="text" name="nom" required></div>
            <div><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
            <div><label class="form-label">Mot de passe</label><input class="form-control" type="password" name="mot_de_passe" minlength="6" required></div>
            <button class="btn btn-primary" type="submit"><i class="fas fa-user-plus me-2"></i>Créer mon compte</button>
        </form>
        <p class="mt-3 mb-0 text-muted">Déjà inscrit ? <a href="/connexion">Se connecter</a></p>
    </main>
</body>
</html>
